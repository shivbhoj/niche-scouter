name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nichescouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks (tsc, eslint, vitest)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/nichescouter_test?schema=public
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/nichescouter_test?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/nichescouter_test?schema=public
          AUTH_SECRET: github-actions-ci-auth-secret-key-32chars
        run: npm run check

      - name: Build Next.js application
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/nichescouter_test?schema=public
          DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/nichescouter_test?schema=public
          AUTH_SECRET: github-actions-ci-auth-secret-key-32chars
        run: npm run build
